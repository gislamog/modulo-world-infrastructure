# Local development only. Compose merges this over compose.yaml
# automatically. Production runs the base file alone, so the
# database is reachable only on the internal Docker network.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    volumes:
      # Source is mounted so Nest's watch mode sees host edits.
      - ../modulo-world-backend:/app
      # An anonymous volume masks the host's node_modules with the copy
      # installed inside the image. Without this the bind mount above
      # shadows it, and modules built for Windows or for a different CPU
      # architecture are loaded instead of the Linux ones.
      - /app/node_modules
    environment:
      # tsc watches through inotify, which receives no events for files
      # edited on the Windows side of the mount. Polling is the only
      # thing that works across that boundary.
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
      CHOKIDAR_USEPOLLING: "true"

  frontend:
    volumes:
      - ../modulo-world-frontend:/app
      - /app/node_modules
    environment:
      # Vite's file watcher does not receive inotify events across the
      # Windows/WSL boundary; polling is slower but actually works.
      CHOKIDAR_USEPOLLING: "true"
