name: modulo-world

services:
  postgres:
    # Pinned to a minor version. 'latest' would silently upgrade the
    # database engine under a volume written by an older one.
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # Named volume: survives 'docker compose down'.
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modulo-world
    healthcheck:
      # Lets other services wait for a database that actually accepts
      # queries, not just a container that has started.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../modulo-world-backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT is required}
    depends_on:
      postgres:
        # Wait for a database that answers queries, not just a started
        # container. Nest would otherwise crash on its first connection.
        condition: service_healthy
    healthcheck:
      # Consumes the API's own health endpoint, which queries the database.
      # A 503 marks the container unhealthy.
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - modulo-world

  frontend:
    build:
      context: ../modulo-world-frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: /api
      PUBLIC_SITE_URL: http://localhost:${HTTP_PORT:-80}
    networks:
      - modulo-world

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # The only published port. Everything else is internal.
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Both are included from the http block by the base image. The map
      # file is loaded first because default.conf references its variable.
      - ./nginx/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - modulo-world

volumes:
  postgres-data:

networks:
  modulo-world: