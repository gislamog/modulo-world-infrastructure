name: modulo-world

services:
  postgres:
    # Pinned to a minor version. 'latest' would silently upgrade the
    # database engine under a volume written by an older one.
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # Named volume: survives 'docker compose down'.
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modulo-world
    healthcheck:
      # Lets other services wait for a database that actually accepts
      # queries, not just a container that has started.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:

networks:
  modulo-world: