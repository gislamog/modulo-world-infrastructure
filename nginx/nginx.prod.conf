# Production server block. Separate from nginx.conf, which is the
# development one, because the two differ in more than a port:
# compression is on, the HMR WebSocket timeouts are gone, static assets
# are cached, and TLS is terminated here.
#
# Routing is unchanged from development, deliberately:
#   /api/*  ->  NestJS
#   /*      ->  SvelteKit
# One origin, so no CORS and cookies can stay SameSite=Strict.

upstream frontend {
    # Docker's embedded DNS resolves these service names on the
    # modulo-world network.
    server frontend:3000;
}

upstream api {
    server api:3000;
}

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name moduloworld.com www.moduloworld.com;

    server_tokens off;

    # Kept even though certificates are issued over DNS-01. It costs
    # nothing, and it means a fallback to the HTTP-01 challenge works
    # without editing this file under time pressure.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://moduloworld.com$request_uri;
    }
}

# ---- HTTPS: www -> apex ----
# A separate server block rather than an if() inside the main one. One
# canonical hostname, so analytics and cookies do not split in two.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.moduloworld.com;

    ssl_certificate     /etc/letsencrypt/live/moduloworld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moduloworld.com/privkey.pem;
    include /etc/nginx/conf.d/00-tls-params.conf;

    server_tokens off;

    return 301 https://moduloworld.com$request_uri;
}

# ---- HTTPS: the site ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name moduloworld.com;

    ssl_certificate     /etc/letsencrypt/live/moduloworld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moduloworld.com/privkey.pem;
    # Protocols and ciphers live in one file, included by all three
    # server blocks, so the TLS policy cannot drift between them.
    include /etc/nginx/conf.d/00-tls-params.conf;

    # No OCSP stapling. Let's Encrypt stopped including an OCSP responder
    # URL in its certificates in 2025, having moved to short lifetimes and
    # CRLs instead, so nginx ignores the directives and warns on every
    # start. Nothing to staple.

    server_tokens off;
    client_max_body_size 10m;

    # HSTS. Deliberately short to begin with: this header is a one-way
    # door for its own max-age, because a browser that has seen it will
    # refuse plain HTTP to this host until it expires. Ship 5 minutes,
    # confirm the site is healthy, then raise it. Do not add
    # 'preload' until the long max-age has been running for a while,
    # since removal from the preload list takes months.
    add_header Strict-Transport-Security "max-age=300" always;

    # Sent on error responses too, which a bare add_header would skip.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The site is not intended to be framed. Clickjacking protection.
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
    }

    # SvelteKit fingerprints everything under _app/immutable, so the
    # filename changes whenever the content does. Safe to cache forever.
    location /_app/immutable/ {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No 7-day read timeout here. That exists in development for
        # Vite's HMR socket, which production does not have.
        proxy_read_timeout 60s;

        proxy_intercept_errors off;
    }
}
