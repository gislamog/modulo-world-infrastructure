# Shared TLS policy, included by every HTTPS server block.
#
# Certbot's own options-ssl-nginx.conf would normally provide this, but
# it ships with the nginx installer plugin. We use the dns-cloudflare
# image, which does not include it, so the policy is stated here.
#
# One file rather than repeating it per block: three server blocks with
# three copies of a cipher list is three chances for them to drift.

# TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated and are an automatic
# grade cap on any SSL Labs report.
ssl_protocols TLSv1.2 TLSv1.3;

# Forward secrecy throughout: ECDHE only, no plain RSA key exchange. A
# recorded session cannot be decrypted later even if the private key is
# compromised. TLS 1.3 suites are not listed because their set is fixed
# by the protocol and cannot be configured.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Let the client choose. With modern suites the client knows best which
# it can do fastest, and on ARM without AES hardware acceleration that
# is often ChaCha20.
ssl_prefer_server_ciphers off;

# Session resumption saves a full handshake on repeat visits. Shared so
# all workers can read it; 10m holds roughly 40,000 sessions.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
# Off deliberately. Session tickets undermine forward secrecy unless the
# ticket key is rotated, and nginx does not rotate it on its own.
ssl_session_tickets off;
