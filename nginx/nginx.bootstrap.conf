# Bootstrap config: HTTP only, no TLS.
#
# This exists to break a chicken-and-egg. nginx refuses to start when an
# ssl_certificate directive points at a file that does not exist, and the
# certificate cannot be issued until something is serving. So the first
# deploy runs this file, the certificate is issued against it, and the
# stack is then switched to nginx.prod.conf.
#
# It is also what you fall back to if a certificate is ever lost: serving
# the site over plain HTTP is better than not serving it at all while a
# reissue is rate limited.
#
# Not a permanent state. Nothing here should be treated as production.

upstream frontend {
    server frontend:3000;
}

upstream api {
    server api:3000;
}

upstream piano-pogo-marketing {
    server piano-pogo-marketing:80;
}

upstream piano-pogo-game {
    server piano-pogo-game:80;
}

upstream piano-pogo-api {
    server piano-pogo-backend:3000;
}

# PianoPogo needs its own certificate issued too, so it gets its own
# bootstrap block rather than falling through to the catch-all below
# (which would otherwise serve ModuloWorld's frontend on this domain).
server {
    listen 80;
    listen [::]:80;
    server_name pianopogo.com www.pianopogo.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ^~ /learn {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /games {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /songs {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /store {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /settings {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /home {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /assets {
        proxy_pass http://piano-pogo-game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://piano-pogo-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
    }

    location ^~ /marketing-assets {
        proxy_pass http://piano-pogo-marketing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://piano-pogo-marketing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Present so an HTTP-01 challenge works from the bootstrap state.
    # The planned path is DNS-01, which does not use this.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }
}
