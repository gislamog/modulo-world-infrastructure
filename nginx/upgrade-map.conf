# WebSocket upgrade needs the Connection header set to "upgrade" only when
# the client actually asked for one, and "close" otherwise. Nginx has no
# built-in variable for that, so it is mapped here.
#
# This lives in its own file because 'map' belongs at the http level, while
# conf.d/default.conf is already inside the http block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
