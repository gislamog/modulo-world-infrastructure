# Single origin for the whole site. Nginx is the only container that
# publishes a host port; SvelteKit, NestJS and Postgres are reachable
# only on the internal Docker network.
#
# Routing is by path prefix:
#   /api/*  ->  NestJS   (which sets a global 'api' prefix of its own)
#   /*      ->  SvelteKit
#
# Because the browser sees one origin, no CORS headers are needed and
# auth cookies can use SameSite=Strict.

upstream frontend {
    # Docker's embedded DNS resolves these service names on the
    # modulo-world network.
    server frontend:3000;
}

upstream api {
    server api:3000;
}

server {
    listen 80;
    server_name _;

    # Vite serves source maps and HMR payloads that compress poorly and
    # are large; leave compression to production builds only.
    gzip off;

    # Uploads and game payloads. Default is 1m, which is small enough to
    # surprise you later.
    client_max_body_size 10m;

    # Do not advertise the exact nginx version on error pages.
    server_tokens off;

    location /api/ {
        proxy_pass http://api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API is the only thing that should be answering here. Without
        # this, an upstream error would fall through to the SvelteKit 404
        # and look like a routing bug.
        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade. Vite's HMR client opens a socket back to the
        # dev server; without these two headers the connection is refused
        # and hot reload silently falls back to full page reloads.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # HMR connections are idle between edits. The default 60s read
        # timeout would drop them.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;

        # Unknown paths are SvelteKit's problem, not nginx's: it owns the
        # 404 page so the site keeps its own styling.
        proxy_intercept_errors off;
    }
}
