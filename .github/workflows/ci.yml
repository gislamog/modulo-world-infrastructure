name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate compose and nginx config
    runs-on: ubuntu-latest

    # This repository builds no application code, so there is nothing to
    # lint or typecheck. What can break here is the configuration, and
    # both files below are checked by the tools that consume them.
    steps:
      - uses: actions/checkout@v4

      # The compose file interpolates required variables with the
      # ${VAR:?message} form, which aborts when one is unset. These are
      # throwaway values: config validation never starts a container.
      - name: Validate Compose files
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          IP_HASH_SALT: ci
        run: |
          # The base file alone is what production runs.
          docker compose -f compose.yaml config --quiet
          # And the merged pair, which is what local development runs.
          docker compose -f compose.yaml -f compose.override.yaml config --quiet

      # nginx -t is the config parser itself, so this catches a typo that
      # would otherwise only surface when the container refuses to start.
      # The config is mounted into conf.d, so it is tested where it lands.
      #
      # The upstream blocks name 'frontend' and 'api', and nginx resolves
      # those at config-load time: a bare container fails with "host not
      # found in upstream" no matter how correct the file is. So the test
      # runs on a network where both names resolve, with two throwaway
      # containers standing in for the real services.
      - name: Validate Nginx config
        run: |
          docker network create nginx-check
          docker run -d --name frontend --network nginx-check --network-alias frontend alpine sleep 60
          docker run -d --name api --network nginx-check --network-alias api alpine sleep 60
          docker run --rm --network nginx-check \
            -v "$PWD/nginx/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro" \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Clean up validation containers
        # Runs even when the check above fails, so a red build leaves
        # nothing behind on the runner.
        if: always()
        run: |
          docker rm -f frontend api 2>/dev/null || true
          docker network rm nginx-check 2>/dev/null || true
